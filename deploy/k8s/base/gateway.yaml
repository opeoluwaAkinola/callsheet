apiVersion: v1
kind: ServiceAccount
metadata:
  name: gateway
  # On EKS, bind the `gateway_publish_policy_arn` Terraform output to this account (Pod Identity / IRSA).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway
data:
  SCHEDULING_URL: http://scheduling-service:8081
  CREW_URL: http://crew-service:8082
  CALLSHEET_BUCKET: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels: { app.kubernetes.io/name: gateway, app.kubernetes.io/part-of: callsheet }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: gateway }
  template:
    metadata:
      labels: { app.kubernetes.io/name: gateway, app.kubernetes.io/part-of: callsheet }
    spec:
      serviceAccountName: gateway
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: app
          image: callsheet/gateway
          ports: [{ name: http, containerPort: 4000 }]
          envFrom: [{ configMapRef: { name: gateway } }]
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 256Mi }
          livenessProbe:
            httpGet: { path: /health, port: http }
          readinessProbe:
            httpGet: { path: /health, port: http }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  selector: { app.kubernetes.io/name: gateway }
  ports: [{ name: http, port: 4000, targetPort: http }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: gateway }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
