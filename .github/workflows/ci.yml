name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scheduling-service:
    name: scheduling-service (Java)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/scheduling-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: ./mvnw -B verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-scheduling-service
          path: services/scheduling-service/target/surefire-reports/

  node:
    name: ${{ matrix.package }} (Node)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [services/crew-service, services/gateway, functions/callsheet-pdf]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  web:
    name: web (Vue)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  terraform:
    name: terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: mkdir -p ../../functions/callsheet-pdf/dist && terraform init -backend=false && terraform validate

  kubernetes:
    name: kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: kubectl kustomize deploy/k8s/overlays/local > /dev/null

  e2e:
    name: end-to-end (docker compose)
    needs: [scheduling-service, node, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d --wait
      - name: Smoke test through the web proxy
        run: ./scripts/smoke-test.sh http://localhost:8080
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
